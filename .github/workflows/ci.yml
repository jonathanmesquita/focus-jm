name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: for f in assets/js/*.js tests/*.js; do node --check "$f"; done
      - name: vercel.json has a CSP without unsafe-inline, unsafe-eval or *
        run: node -e "const c=require('./vercel.json');const csp=c.headers[0].headers.find(h=>h.key==='Content-Security-Policy');if(!csp||/unsafe-inline|unsafe-eval|\*/.test(csp.value))process.exit(1)"
      - name: Tests
        run: npm test
